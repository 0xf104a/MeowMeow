# Documentation site, built by Zensical from the staged copy of README.md and docs/.
# Run `python .github/scripts/stage_docs.py` before `zensical build` or `zensical serve`.
[project]
site_url = "https://meowmeow.readthedocs.io/"
site_name = "MeowMeow"
site_description = "A tiny modular web server in Erlang with an MCP gateway"
site_author = "Anna-Sofia Kasierocka"
repo_url = "https://github.com/0xf104a/MeowMeow"
repo_name = "0xf104a/MeowMeow"
docs_dir = "_docs"
strict = true

nav = [
  { "Overview" = "index.md" },
  { "Getting started" = [
    { "Getting started" = "docs/index.md" },
    { "Installation" = "docs/getting-started/installation.md" },
    { "Quickstart" = "docs/getting-started/quickstart.md" },
    { "Docker" = "docs/getting-started/docker.md" },
  ] },
  { "Configuration" = [
    { "Overview" = "docs/configuration/overview.md" },
    { "Server (meow.conf)" = "docs/configuration/server.md" },
    { "Routes (routes.conf)" = "docs/configuration/routes.md" },
    { "Examples" = "docs/configuration/examples.md" },
  ] },
  { "Modules" = [
    { "Modules" = "docs/modules/index.md" },
    { "static" = "docs/modules/static.md" },
    { "route" = "docs/modules/route.md" },
    { "header" = "docs/modules/header.md" },
    { "env" = "docs/modules/env.md" },
    { "mcp" = "docs/modules/mcp.md" },
  ] },
  { "Development" = [
    { "Architecture" = "docs/development/architecture.md" },
    { "Writing modules" = "docs/development/writing-modules.md" },
    { "Testing" = "docs/development/testing.md" },
    { "Benchmarking" = "docs/development/benchmarking.md" },
    { "Benchmark results" = "docs/benchmarks.md" },
    { "Releasing" = "docs/development/releasing.md" },
  ] },
  { "Reference" = [
    { "Directives" = "docs/reference/directives.md" },
    { "Status codes" = "docs/reference/status-codes.md" },
  ] },
]

extra_css = ["docs/assets/material3.css"]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.font]
text = "Roboto"
code = "Fira Code"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/0xf104a/MeowMeow"

[[project.extra.social]]
icon = "fontawesome/brands/docker"
link = "https://github.com/0xf104a/MeowMeow/pkgs/container/meowmeow"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true

[project.plugins.search]
