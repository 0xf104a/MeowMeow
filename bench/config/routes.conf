# MeowMeow benchmark routing configuration.
# Installed to /etc/nya/routes.conf by bench/Dockerfile. Each path below is
# exercised by one scenario of bench/scenarios.tsv; keep the two in sync.

Include "/etc/nya/mimes.conf"

Route *
 Set-Header X-Powered-By "Pusheen the Cat"
End

# Routing and response assembly only: no file system access.
Route /generate_204
 No-Content
End

# Rule-chain cost: eight Set-Header directives before the response is sent.
Route /headers
 Set-Header X-Bench-1 one
 Set-Header X-Bench-2 two
 Set-Header X-Bench-3 three
 Set-Header X-Bench-4 four
 Set-Header X-Bench-5 five
 Set-Header X-Bench-6 six
 Set-Header X-Bench-7 seven
 Set-Header X-Bench-8 eight
 No-Content
End

# Abort directive: status line and error body, no file.
Route /teapot
 Abort 418
End

# Rule evaluation scaling: 256 Route blocks that do not match are evaluated
# before /deep matches. filler.conf is generated by bench/fixtures.sh.
Include "/etc/nya/filler.conf"

Route /deep
 No-Content
End

# Explicit file: Send-File skips the DocDir lookup.
Route /sendfile
 Send-File /var/www/bench/64k.bin
End

# Everything else comes from the document root: index.html, bench/*.bin
# (generated by bench/fixtures.sh) and /missing, which yields a 404.
Route *
 DocDir /var/www
End
