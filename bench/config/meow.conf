# MeowMeow benchmark server configuration.
# Installed to /etc/nya/meow.conf by bench/Dockerfile; bench/entrypoint.sh
# rewrites ListenPort and LogLevel from MEOW_PORT / MEOW_LOGLEVEL at start.

ListenPort 8089
ListenHost 0.0.0.0

# Errors only: logging at level 3 or 4 writes several lines per request and
# would dominate the measurement.
LogLevel 1

# Keep idle connections for 10 s; wrk keeps its connections open for the
# whole run, so this only matters for the conn_close scenario.
KeepAlive 10000

AllowLegacyHttp No

LoadModules static,header,route,env
