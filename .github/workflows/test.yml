name: Tests
on: [push]

jobs:
  # Unit tests run first and gate the (slow, Docker based) end-to-end suite:
  # the E2E job only starts when every EUnit suite passed.
  eunit:
    name: EUnit (unit tests)
    runs-on: ubuntu-latest
    container:
      image: erlang:28.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run EUnit suites
        run: rebar3 eunit
      - name: Coverage summary
        if: always()
        run: rebar3 cover --verbose

  e2e:
    name: End-to-end (Docker)
    needs: eunit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: docker build -t test.meow.meow -f tests/Dockerfile .
      - name: Test
        run: docker run test.meow.meow
